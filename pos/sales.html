<script>

// ============================================================
// SERVER
// ============================================================

const SERVER_URL =
    "http://127.0.0.1:8000";


// ============================================================
// PAGINATION
// ============================================================

const SALES_PER_PAGE =
    16;


let sales =
    [];


let filteredSales =
    [];


let currentPage =
    1;


let appDialogResolver =
    null;


let saleAdjustmentInProgress =
    false;


// ============================================================
// FORMAT MONEY
// ============================================================

function formatMoney(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "vi-VN"
    ) + " VND";

}


function formatPaymentMethod(
    value
) {

    const normalized =
        String(
            value ||
            ""
        )
            .trim()
            .toUpperCase();


    if (
        normalized ===
        "CASH"
    ) {

        return "Cash";

    }


    if (
        normalized ===
        "BANK_TRANSFER"
    ) {

        return "Bank Transfer";

    }


    return "Not recorded";

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ============================================================
// APP DIALOG
// ============================================================

function closeAppDialog(
    result
) {

    const overlay =
        document.getElementById(
            "appDialogOverlay"
        );


    overlay.classList.remove(
        "active"
    );


    if (
        appDialogResolver
    ) {

        const resolver =
            appDialogResolver;


        appDialogResolver =
            null;


        resolver(
            result
        );

    }

}


function showAppDialog(
    message,
    options = {}
) {

    return new Promise(
        resolve => {

            appDialogResolver =
                resolve;


            const overlay =
                document.getElementById(
                    "appDialogOverlay"
                );


            const title =
                document.getElementById(
                    "appDialogTitle"
                );


            const messageElement =
                document.getElementById(
                    "appDialogMessage"
                );


            const confirmButton =
                document.getElementById(
                    "appDialogConfirmButton"
                );


            const cancelButton =
                document.getElementById(
                    "appDialogCancelButton"
                );


            title.textContent =
                options.title ||
                "NAU POS";


            messageElement.textContent =
                String(
                    message ||
                    ""
                );


            confirmButton.textContent =
                options.confirmText ||
                "OK";


            cancelButton.textContent =
                options.cancelText ||
                "CANCEL";


            cancelButton.style.display =
                options.showCancel ===
                false
                    ?
                        "none"
                    :
                        "";


            confirmButton.onclick =
                function() {

                    closeAppDialog(
                        true
                    );

                };


            cancelButton.onclick =
                function() {

                    closeAppDialog(
                        false
                    );

                };


            overlay.classList.add(
                "active"
            );


            confirmButton.focus();

        }
    );

}


function appAlert(
    message,
    options = {}
) {

    return showAppDialog(
        message,
        {
            ...options,

            showCancel:
                false,

            confirmText:
                options.confirmText ||
                "OK"
        }
    );

}


function appConfirm(
    message,
    options = {}
) {

    return showAppDialog(
        message,
        {
            ...options,

            showCancel:
                true
        }
    );

}


// ============================================================
// FORMAT VOID / REFUND TIME
// ============================================================

function formatAdjustmentDateTime(
    timestamp
) {

    const formatted =
        formatPaidDate(
            timestamp
        );


    if (
        formatted.date ===
        "Unknown date"
    ) {

        return "Unknown time";

    }


    return (
        formatted.date +
        " " +
        formatted.time
    ).trim();

}


// ============================================================
// FORMAT PAID DATE
// ============================================================

function formatPaidDate(
    timestamp
) {

    if (!timestamp) {

        return {

            date:
                "Unknown date",

            time:
                "Unknown time"

        };

    }


    const date =
        new Date(
            timestamp
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return {

            date:
                String(
                    timestamp
                ),

            time:
                ""

        };

    }


    return {

        date:
            date.toLocaleDateString(
                "en-GB"
            ),

        time:
            date.toLocaleTimeString(
                "en-GB",
                {

                    hour:
                        "2-digit",

                    minute:
                        "2-digit",

                    second:
                        "2-digit"

                }
            )

    };

}


// ============================================================
// CREATE DAY OPTIONS
// ============================================================

function createDayOptions() {

    const dayFilter =
        document.getElementById(
            "dayFilter"
        );


    for (
        let day = 1;
        day <= 31;
        day++
    ) {

        const option =
            document.createElement(
                "option"
            );


        const value =
            String(
                day
            ).padStart(
                2,
                "0"
            );


        option.value =
            value;


        option.textContent =
            day;


        dayFilter.appendChild(
            option
        );

    }

}


// ============================================================
// CREATE YEAR OPTIONS
//
// NAU POS starts in 2026.
//
// The dropdown always starts at 2026 and extends
// one year beyond the current year.
//
// Examples:
//
// 2026 -> 2026, 2027
// 2027 -> 2026, 2027, 2028
// 2028 -> 2026, 2027, 2028, 2029
//
// ============================================================

function createYearOptions() {

    const yearFilter =
        document.getElementById(
            "yearFilter"
        );


    const START_YEAR =
        2026;


    const currentYear =
        new Date().getFullYear();


    const endYear =
        Math.max(
            START_YEAR + 1,
            currentYear + 1
        );


    for (
        let year = START_YEAR;
        year <= endYear;
        year++
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            String(
                year
            );


        option.textContent =
            String(
                year
            );


        yearFilter.appendChild(
            option
        );

    }

}


// ============================================================
// GET SELECTED DATE
// ============================================================

function getSelectedDate() {

    const day =
        document.getElementById(
            "dayFilter"
        ).value;


    const month =
        document.getElementById(
            "monthFilter"
        ).value;


    const year =
        document.getElementById(
            "yearFilter"
        ).value;


    if (
        !day ||
        !month ||
        !year
    ) {

        return "";

    }


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


// ============================================================
// CHECK IF SELECTED DATE IS REAL
// ============================================================

function selectedDateIsValid() {

    const day =
        document.getElementById(
            "dayFilter"
        ).value;


    const month =
        document.getElementById(
            "monthFilter"
        ).value;


    const year =
        document.getElementById(
            "yearFilter"
        ).value;


    if (
        !day ||
        !month ||
        !year
    ) {

        return false;

    }


    const numericYear =
        Number(
            year
        );


    const numericMonth =
        Number(
            month
        );


    const numericDay =
        Number(
            day
        );


    const testDate =
        new Date(
            numericYear,
            numericMonth - 1,
            numericDay
        );


    return (
        testDate.getFullYear() ===
            numericYear
        &&
        testDate.getMonth() ===
            numericMonth - 1
        &&
        testDate.getDate() ===
            numericDay
    );

}


// ============================================================
// DATE FILTER CHANGED
// ============================================================

function dateFilterChanged() {

    const day =
        document.getElementById(
            "dayFilter"
        ).value;


    const month =
        document.getElementById(
            "monthFilter"
        ).value;


    const year =
        document.getElementById(
            "yearFilter"
        ).value;


    if (
        !day ||
        !month ||
        !year
    ) {

        return;

    }


    if (
        !selectedDateIsValid()
    ) {

        appAlert(
            "That date does not exist.",
            {
                title:
                    "Invalid Date",

                tone:
                    "warning"
            }
        );

        return;

    }


    currentPage =
        1;


    loadSales();

}


// ============================================================
// CHECK SERVER
// ============================================================

async function checkServer() {

    try {

        const response =
            await fetch(
                SERVER_URL + "/"
            );


        if (!response.ok) {

            throw new Error(
                "Server unavailable"
            );

        }


        const data =
            await response.json();


        if (
            data.status !==
            "online"
        ) {

            throw new Error(
                "Invalid server response"
            );

        }


        document.getElementById(
            "serverStatus"
        ).textContent =
            "Server online";


        document.getElementById(
            "serverStatus"
        ).style.color =
            "#7cff7c";


        return true;

    }

    catch (error) {

        document.getElementById(
            "serverStatus"
        ).textContent =
            "Server offline";


        document.getElementById(
            "serverStatus"
        ).style.color =
            "#ff6666";


        console.error(
            error
        );


        return false;

    }

}


// ============================================================
// LOAD SALES
// ============================================================

async function loadSales() {

    const grid =
        document.getElementById(
            "salesGrid"
        );


    grid.innerHTML = `

        <div class="messageBox">
            Loading sales...
        </div>

    `;


    try {

        const selectedDate =
            getSelectedDate();


        let url =
            SERVER_URL +
            "/api/sales/history";


        if (
            selectedDate
        ) {

            url +=
                "?date=" +
                encodeURIComponent(
                    selectedDate
                );

        }


        const response =
            await fetch(
                url
            );


        let data;


        try {

            data =
                await response.json();

        }

        catch {

            data = {};

        }


        if (
            !response.ok ||
            data.success !== true
        ) {

            throw new Error(
                data.error ||
                "Could not load sales history."
            );

        }


        sales =
            Array.isArray(
                data.sales
            )
                ? data.sales
                : [];


        sales.sort(
            (
                first,
                second
            ) => {

                const firstTime =
                    new Date(
                        first.paid_at ||
                        0
                    ).getTime();


                const secondTime =
                    new Date(
                        second.paid_at ||
                        0
                    ).getTime();


                return (
                    secondTime -
                    firstTime
                );

            }
        );


        currentPage =
            1;


        applyFilters();

    }

    catch (error) {

        console.error(
            "Could not load sales:",
            error
        );


        sales =
            [];


        filteredSales =
            [];


        grid.innerHTML = `

            <div class="messageBox error">
                ${escapeHTML(
                    error.message
                )}
            </div>

        `;


        updateSummary();

        updatePagination();

    }

}


// ============================================================
// APPLY SEARCH FILTER
// ============================================================

function applyFilters() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    filteredSales =
        sales.filter(
            sale => {

                if (
                    !search
                ) {

                    return true;

                }


                const drinks =
                    getDrinkNames(
                        sale
                    )
                        .join(
                            " "
                        );


                const promo =
                    (
                        sale.promo &&
                        typeof sale.promo ===
                        "object"
                    )
                        ?
                            sale.promo
                        :
                            {};


                const standaloneIngredients =
                    Array.isArray(
                        sale.items
                    )
                        ?
                            sale.items
                                .map(
                                    item => {

                                        const standalone =
                                            (
                                                item &&
                                                item.standalone_ingredient &&
                                                typeof item.standalone_ingredient ===
                                                "object"
                                            )
                                                ?
                                                    item.standalone_ingredient
                                                :
                                                    null;


                                        if (
                                            !standalone
                                        ) {

                                            return "";

                                        }


                                        return [
                                            standalone.id,
                                            standalone.name,
                                            standalone.category,
                                            standalone.type,
                                            standalone.unit,
                                            standalone.amount_each,
                                            standalone.total_amount
                                        ]
                                            .join(
                                                " "
                                            );

                                    }
                                )
                                .join(
                                    " "
                                )
                        :
                            "";


                const searchText =
                    [

                        sale.transaction_id,

                        sale.table,

                        sale.table_number,

                        sale.paid_at,

                        sale.payment_method,

                        formatPaymentMethod(
                            sale.payment_method
                        ),

                        drinks,

                        standaloneIngredients,

                        promo.id,

                        promo.name,

                        promo.type,

                        promo.value,

                        sale.refunded === true
                            ?
                                "refunded"
                            :
                                "",

                        sale.voided === true
                            ?
                                "voided"
                            :
                                "",

                        sale.timeVR,

                        sale.original_total

                    ]
                        .join(
                            " "
                        )
                        .toLowerCase();


                return searchText.includes(
                    search
                );

            }
        );


    const maxPage =
        Math.max(
            1,
            Math.ceil(
                filteredSales.length /
                SALES_PER_PAGE
            )
        );


    if (
        currentPage >
        maxPage
    ) {

        currentPage =
            maxPage;

    }


    renderSales();

    updateSummary();

    updatePagination();

}


// ============================================================
// GET DRINK NAMES
// ============================================================

function getDrinkNames(
    sale
) {

    if (
        Array.isArray(
            sale.drink_names
        )
        &&
        sale.drink_names.length > 0
    ) {

        return sale.drink_names.map(
            item =>
                String(
                    item
                )
        );

    }


    if (
        Array.isArray(
            sale.items
        )
    ) {

        return sale.items.map(
            item => {

                const name =
                    item.name ||
                    item.recipe_id ||
                    "Unknown drink";


                const quantity =
                    Number(
                        item.quantity ||
                        1
                    );


                if (
                    quantity > 1
                ) {

                    return (
                        name +
                        " x" +
                        quantity
                    );

                }


                return name;

            }
        );

    }


    return [];

}


// ============================================================
// GET DRINK DISPLAY ITEMS
//
// Uses the price snapshots already stored in sale history.
//
// sale_price_each = base price for ONE drink
// substitution_charge = total SUB charge for this line item
//
// Older history files still work without inventing prices.
// ============================================================

function getDrinkDisplayItems(
    sale
) {

    if (
        Array.isArray(
            sale.items
        )
        &&
        sale.items.length > 0
    ) {

        return sale.items.map(
            item => {

                const name =
                    item.name ||
                    item.recipe_id ||
                    "Unknown drink";


                const quantity =
                    Number(
                        item.quantity ||
                        1
                    );


                const displayName =
                    quantity > 1
                        ?
                            name +
                            " x" +
                            quantity
                        :
                            name;


                const substitutionCharge =
                    Number(
                        item.substitution_charge ||
                        0
                    );


                /*
                    This is the historical base price of
                    ONE drink at the time of the sale.
                */

                let priceEach =
                    Number(
                        item.sale_price_each
                    );


                /*
                    Compatibility fallback.

                    If sale_price_each is missing but the
                    historical line base price exists,
                    calculate the unit price from that.
                */

                if (
                    !Number.isFinite(
                        priceEach
                    )
                ) {

                    const baseSalePrice =
                        Number(
                            item.base_sale_price
                        );


                    if (
                        Number.isFinite(
                            baseSalePrice
                        )
                        &&
                        quantity > 0
                    ) {

                        priceEach =
                            baseSalePrice /
                            quantity;

                    }

                }


                const standaloneIngredient =
                    (
                        item.standalone_ingredient &&
                        typeof item.standalone_ingredient ===
                        "object"
                    )
                        ?
                            item.standalone_ingredient
                        :
                            null;


                const bespokeRecipe =
                    (
                        item.bespoke_recipe &&
                        typeof item.bespoke_recipe ===
                        "object"
                    )
                        ?
                            item.bespoke_recipe
                        :
                            null;


                return {

                    name:
                        displayName,

                    quantity:
                        quantity,

                    priceEach:
                        priceEach,

                    hasPrice:
                        Number.isFinite(
                            priceEach
                        ),

                    substitutionCharge:
                        substitutionCharge,

                    substitutions:
                        Array.isArray(
                            item.substitutions
                        )
                            ?
                                item.substitutions
                            :
                                [],

                    standaloneIngredient:
                        standaloneIngredient,

                    bespokeRecipe:
                        bespokeRecipe,

                    ingredientCost:
                        Number(
                            item.ingredient_cost ||
                            0
                        )

                };

            }
        );

    }


    /*
        Very old sales may only contain drink_names.

        Keep displaying them normally, but do not invent
        historical pricing that was never stored.
    */

    return getDrinkNames(
        sale
    ).map(
        name => ({

            name:
                name,

            quantity:
                1,

            priceEach:
                0,

            hasPrice:
                false,

            substitutionCharge:
                0,

            substitutions:
                [],

            standaloneIngredient:
                null

        })
    );

}


// ============================================================
// GET COCKTAIL SUBSTITUTION DISPLAY
//
// The server permanently stores each substitution snapshot in
// item.substitutions, including names, amounts and the exact
// charge calculated when the sale was finalized.
// ============================================================

function getCocktailSubstitutionDisplay(
    drink
) {

    const substitutions =
        (
            drink &&
            Array.isArray(
                drink.substitutions
            )
        )
            ?
                drink.substitutions
            :
                [];


    const totalCharge =
        Number(
            drink &&
            drink.substitutionCharge ||
            0
        );


    if (
        substitutions.length ===
        0
        &&
        totalCharge <= 0
    ) {

        return "";

    }


    let linesHTML =
        "";


    if (
        substitutions.length >
        0
    ) {

        linesHTML =
            substitutions
                .map(
                    substitution => {

                        const kind =
                            String(
                                substitution.kind ||
                                ""
                            )
                                .trim()
                                .toUpperCase();


                        const originalName =
                            String(
                                substitution.original_name ||
                                substitution.original_id ||
                                "Ingredient"
                            ).trim();


                        const substituteName =
                            String(
                                substitution.substitute_name ||
                                substitution.substitute_id ||
                                originalName
                            ).trim();


                        const unit =
                            String(
                                substitution.unit ||
                                ""
                            ).trim();


                        const quantity =
                            Number(
                                substitution.quantity ||
                                drink.quantity ||
                                1
                            );


                        const recipeAmount =
                            Number(
                                substitution.recipe_amount
                            );


                        const amount =
                            Number(
                                substitution.amount
                            );


                        const charge =
                            Number(
                                substitution.charge ||
                                0
                            );


                        const formatAmount =
                            value => {

                                if (
                                    !Number.isFinite(
                                        value
                                    )
                                ) {

                                    return "";

                                }


                                return value.toLocaleString(
                                    "en-US",
                                    {
                                        maximumFractionDigits:
                                            3
                                    }
                                );

                            };


                        let description =
                            "";


                        if (
                            kind ===
                            "AMOUNT"
                        ) {

                            description =
                                originalName;


                            if (
                                Number.isFinite(
                                    recipeAmount
                                )
                                &&
                                Number.isFinite(
                                    amount
                                )
                            ) {

                                description +=
                                    " • " +
                                    formatAmount(
                                        recipeAmount
                                    ) +
                                    " → " +
                                    formatAmount(
                                        amount
                                    );


                                if (
                                    unit
                                ) {

                                    description +=
                                        " " +
                                        unit;

                                }

                            }

                        }

                        else {

                            description =
                                originalName +
                                " → " +
                                substituteName;


                            if (
                                Number.isFinite(
                                    amount
                                )
                            ) {

                                description +=
                                    " • " +
                                    formatAmount(
                                        amount
                                    );


                                if (
                                    unit
                                ) {

                                    description +=
                                        " " +
                                        unit;

                                }

                            }

                        }


                        if (
                            quantity > 1
                            &&
                            Number.isFinite(
                                amount
                            )
                        ) {

                            description +=
                                " each";

                        }


                        return `

                            <div class="substitutionLine">

                                <div class="substitutionDescription">

                                    ${escapeHTML(
                                        description
                                    )}

                                </div>

                                <div class="substitutionLinePrice">

                                    +${formatMoney(
                                        charge
                                    )}

                                </div>

                            </div>

                        `;

                    }
                )
                .join(
                    ""
                );

    }

    else {

        linesHTML = `

            <div class="substitutionUnavailable">
                Substitution details were not stored for this older sale.
            </div>

        `;

    }


    return `

        <div class="substitutionBox">

            <div class="substitutionHeader">

                <span>
                    Substitution charge
                </span>

                <span class="substitutionTotal">
                    +${formatMoney(
                        totalCharge
                    )}
                </span>

            </div>

            <div class="substitutionList">
                ${linesHTML}
            </div>

        </div>

    `;

}



// ============================================================
// GET BESPOKE RECIPE DISPLAY
//
// BESPOKE history stores the one-time ingredient snapshot and
// calculated ingredient cost. This is internal Sales information.
// Receipt rendering intentionally does not use this function.
// ============================================================

function getBespokeRecipeDisplay(
    drink
) {

    const bespoke =
        (
            drink &&
            drink.bespokeRecipe &&
            typeof drink.bespokeRecipe ===
            "object"
        )
            ?
                drink.bespokeRecipe
            :
                null;


    if (
        !bespoke
    ) {

        return "";

    }


    const lines =
        Array.isArray(
            bespoke.ingredients
        )
            ?
                bespoke.ingredients
            :
                [];


    const ingredientHTML =
        lines.length > 0
            ?
                lines
                    .map(
                        line => {

                            const name =
                                String(
                                    line.name ||
                                    line.id ||
                                    "Unknown ingredient"
                                ).trim();


                            const amount =
                                Number(
                                    line.amount
                                );


                            const amountText =
                                Number.isFinite(
                                    amount
                                )
                                    ?
                                        amount.toLocaleString(
                                            "en-US",
                                            {
                                                maximumFractionDigits:
                                                    3
                                            }
                                        )
                                    :
                                        "";


                            const unit =
                                String(
                                    line.unit ||
                                    ""
                                ).trim();


                            const lineCost =
                                Number(
                                    line.line_cost
                                );


                            return `

                                <div class="bespokeRecipeIngredient">

                                    ${escapeHTML(
                                        name
                                    )}
                                    •
                                    ${escapeHTML(
                                        amountText
                                    )}
                                    ${escapeHTML(
                                        unit
                                    )}
                                    ${
                                        Number.isFinite(
                                            lineCost
                                        )
                                            ?
                                                " • " +
                                                formatMoney(
                                                    lineCost
                                                )
                                            :
                                                ""
                                    }

                                </div>

                            `;

                        }
                    )
                    .join(
                        ""
                    )
            :
                `

                    <div class="bespokeRecipeIngredient">
                        Ingredient details unavailable.
                    </div>

                `;


    const cost =
        Number(
            bespoke.ingredient_cost ??
            drink.ingredientCost
        );


    return `

        <div class="bespokeRecipeBox">

            <div class="bespokeRecipeHeader">

                <span>
                    Bespoke recipe
                </span>

                <span class="bespokeRecipeCost">
                    Cost:
                    ${formatMoney(
                        Number.isFinite(
                            cost
                        )
                            ?
                                cost
                            :
                                0
                    )}
                </span>

            </div>

            ${ingredientHTML}

        </div>

    `;

}


// ============================================================
// GET SHOT INGREDIENT DISPLAY
//
// SHOT history permanently stores the selected ingredient,
// amount and unit inside standalone_ingredient.
//
// Older non-SHOT sales simply return no extra display.
// ============================================================

function getShotIngredientDisplay(
    drink
) {

    const standalone =
        (
            drink &&
            drink.standaloneIngredient &&
            typeof drink.standaloneIngredient ===
            "object"
        )
            ?
                drink.standaloneIngredient
            :
                null;


    if (
        !standalone
    ) {

        return "";

    }


    const ingredientName =
        String(
            standalone.name ||
            standalone.id ||
            "Unknown ingredient"
        ).trim();


    const unit =
        String(
            standalone.unit ||
            ""
        ).trim();


    let amountEach =
        Number(
            standalone.amount_each
        );


    if (
        !Number.isFinite(
            amountEach
        )
    ) {

        amountEach =
            Number(
                standalone.amount
            );

    }


    let totalAmount =
        Number(
            standalone.total_amount
        );


    if (
        !Number.isFinite(
            totalAmount
        )
        &&
        Number.isFinite(
            amountEach
        )
    ) {

        totalAmount =
            amountEach *
            Number(
                drink.quantity ||
                1
            );

    }


    let amountText =
        "";


    if (
        Number.isFinite(
            amountEach
        )
    ) {

        amountText =
            amountEach.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits:
                        3
                }
            )
            +
            (
                unit
                    ?
                        " " +
                        unit
                    :
                        ""
            );

    }


    if (
        Number(
            drink.quantity ||
            1
        ) > 1
        &&
        Number.isFinite(
            totalAmount
        )
    ) {

        const totalText =
            totalAmount.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits:
                        3
                }
            )
            +
            (
                unit
                    ?
                        " " +
                        unit
                    :
                        ""
            );


        amountText +=
            (
                amountText
                    ?
                        " each • "
                    :
                        ""
            )
            +
            totalText
            +
            " total";

    }


    return `

        <div class="shotIngredientBox">

            <div class="shotIngredientName">

                ${escapeHTML(
                    ingredientName
                )}

            </div>

            ${
                amountText
                    ?
                        `

                            <div class="shotIngredientAmount">

                                ${escapeHTML(
                                    amountText
                                )}

                            </div>

                        `
                    :
                        ""
            }

        </div>

    `;

}


// ============================================================
// GET SALE SUBTOTAL
//
// New promo-aware sales store subtotal directly.
// Older sales fall back to base + substitution charges.
// ============================================================

function getSaleSubtotal(
    sale
) {

    if (
        sale.subtotal !==
        undefined
        &&
        sale.subtotal !==
        null
    ) {

        return Number(
            sale.subtotal ||
            0
        );

    }


    const baseSalePrice =
        Number(
            sale.base_sale_price ||
            0
        );


    const substitutionCharge =
        Number(
            sale.substitution_charge ||
            0
        );


    const calculatedSubtotal =
        baseSalePrice +
        substitutionCharge;


    if (
        calculatedSubtotal >
        0
    ) {

        return calculatedSubtotal;

    }


    return Number(
        sale.total ||
        0
    );

}


// ============================================================
// PROMO VALUE DISPLAY
// ============================================================

function getPromoValueDisplay(
    promo
) {

    if (
        !promo ||
        typeof promo !==
        "object"
    ) {

        return "";

    }


    const type =
        String(
            promo.type ||
            ""
        )
            .trim()
            .toUpperCase();


    const value =
        Number(
            promo.value ||
            0
        );


    if (
        type ===
        "PERCENT"
    ) {

        return (
            value.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits:
                        3
                }
            )
            +
            "%"
        );

    }


    if (
        type ===
        "FIXED"
    ) {

        return formatMoney(
            value
        );

    }


    return String(
        promo.value ??
        ""
    );

}


// ============================================================
// REFUND / VOID SALE
// ============================================================

async function requestSaleAdjustment(
    button,
    action
) {

    if (
        saleAdjustmentInProgress
    ) {

        return;

    }


    const transactionId =
        String(
            button &&
            button.dataset &&
            button.dataset.transactionId ||
            ""
        ).trim();


    action =
        String(
            action ||
            ""
        )
            .trim()
            .toLowerCase();


    if (
        !transactionId
    ) {

        await appAlert(
            "This sale does not have a valid transaction ID.",
            {
                title:
                    "Transaction Error"
            }
        );


        return;

    }


    if (
        action !==
        "refund"
        &&
        action !==
        "void"
    ) {

        await appAlert(
            "Invalid sale action.",
            {
                title:
                    "Sale Error"
            }
        );


        return;

    }


    const sale =
        sales.find(
            item =>
                String(
                    item.transaction_id ||
                    ""
                ).trim()
                ===
                transactionId
        );


    if (
        !sale
    ) {

        await appAlert(
            "The sale could not be found in the loaded history.",
            {
                title:
                    "Sale Not Found"
            }
        );


        return;

    }


    if (
        sale.refunded ===
        true
        ||
        sale.voided ===
        true
    ) {

        await appAlert(
            "This sale has already been refunded or voided.",
            {
                title:
                    "Sale Already Adjusted"
            }
        );


        return;

    }


    const isRefund =
        action ===
        "refund";


    const actionName =
        isRefund
            ?
                "REFUND"
            :
                "VOID";


    const warning =
        isRefund
            ?
                (
                    "Refund this sale?\n\n" +
                    "Transaction: " +
                    transactionId +
                    "\n" +
                    "Paid: " +
                    formatMoney(
                        sale.total
                    ) +
                    "\n\n" +
                    "The sale will remain in history and its total paid will become 0 VND.\n" +
                    "Inventory will NOT be restored."
                )
            :
                (
                    "Void this sale?\n\n" +
                    "Transaction: " +
                    transactionId +
                    "\n" +
                    "Paid: " +
                    formatMoney(
                        sale.total
                    ) +
                    "\n\n" +
                    "The sale will remain in history and its total paid will become 0 VND.\n" +
                    "Inventory used by this sale WILL be restored."
                );


    const confirmed =
        await appConfirm(
            warning,
            {
                title:
                    actionName +
                    " SALE",

                confirmText:
                    actionName,

                cancelText:
                    "CANCEL"
            }
        );


    if (
        !confirmed
    ) {

        return;

    }


    saleAdjustmentInProgress =
        true;


    const actionButtons =
        button.closest(
            ".saleActions"
        );


    if (
        actionButtons
    ) {

        actionButtons
            .querySelectorAll(
                "button"
            )
            .forEach(
                actionButton => {

                    actionButton.disabled =
                        true;

                }
            );

    }


    try {

        const response =
            await fetch(
                SERVER_URL +
                "/api/sales/" +
                encodeURIComponent(
                    transactionId
                ) +
                "/" +
                action,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {}
                        )
                }
            );


        let data;


        try {

            data =
                await response.json();

        }

        catch {

            data = {};

        }


        if (
            !response.ok
            ||
            data.success !==
            true
        ) {

            throw new Error(
                data.error ||
                (
                    "Server returned HTTP " +
                    response.status
                )
            );

        }


        await loadSales();


        await appAlert(
            (
                isRefund
                    ?
                        "Sale refunded successfully."
                    :
                        "Sale voided successfully."
            )
            +
            "\n\nTransaction: " +
            transactionId +
            "\nTotal paid: 0 VND",
            {
                title:
                    actionName +
                    " COMPLETE"
            }
        );

    }

    catch (error) {

        console.error(
            actionName +
            " sale failed:",
            error
        );


        await appAlert(
            (
                isRefund
                    ?
                        "Could not refund this sale."
                    :
                        "Could not void this sale."
            )
            +
            "\n\n" +
            error.message,
            {
                title:
                    actionName +
                    " FAILED"
            }
        );


        if (
            actionButtons
        ) {

            actionButtons
                .querySelectorAll(
                    "button"
                )
                .forEach(
                    actionButton => {

                        actionButton.disabled =
                            false;

                    }
                );

        }

    }

    finally {

        saleAdjustmentInProgress =
            false;

    }

}


// ============================================================
// RENDER SALES
// ============================================================

function renderSales() {

    const grid =
        document.getElementById(
            "salesGrid"
        );


    grid.innerHTML =
        "";


    if (
        filteredSales.length ===
        0
    ) {

        grid.innerHTML = `

            <div class="messageBox">
                No sales found.
            </div>

        `;


        return;

    }


    const startIndex =
        (
            currentPage - 1
        )
        *
        SALES_PER_PAGE;


    const endIndex =
        startIndex +
        SALES_PER_PAGE;


    const pageSales =
        filteredSales.slice(
            startIndex,
            endIndex
        );


    pageSales.forEach(
        sale => {

            const paid =
                formatPaidDate(
                    sale.paid_at
                );


            const drinks =
                getDrinkDisplayItems(
                    sale
                );


            let drinkHTML =
                "";


            if (
                drinks.length ===
                0
            ) {

                drinkHTML = `

                    <div class="drinkItem">
                        No drink information
                    </div>

                `;

            }

            else {

                drinkHTML =
                    drinks
                        .map(
                            drink => `

                                <div class="drinkItem">

                                    <div class="drinkItemMain">

                                        <span class="drinkItemName">

                                            ${escapeHTML(
                                                drink.name
                                            )}

                                        </span>


                                        ${
                                            drink.hasPrice
                                                ?
                                                    `

                                                        <span class="drinkItemPrice">

                                                            ${formatMoney(
                                                                drink.priceEach
                                                            )}${
                                                                drink.quantity > 1
                                                                &&
                                                                !drink.standaloneIngredient
                                                                    ?
                                                                        " each"
                                                                    :
                                                                        ""
                                                            }

                                                        </span>

                                                    `
                                                :
                                                    ""
                                        }

                                    </div>


                                    ${getBespokeRecipeDisplay(
                                        drink
                                    )}


                                    ${getShotIngredientDisplay(
                                        drink
                                    )}


                                    ${getCocktailSubstitutionDisplay(
                                        drink
                                    )}

                                </div>

                            `
                        )
                        .join(
                            ""
                        );

            }


            let promoHTML =
                "";


            const promo =
                (
                    sale.promo &&
                    typeof sale.promo ===
                    "object"
                )
                    ?
                        sale.promo
                    :
                        null;


            const discountAmount =
                Number(
                    sale.discount_amount ||
                    0
                );


            if (
                promo &&
                discountAmount >
                0
            ) {

                const subtotal =
                    getSaleSubtotal(
                        sale
                    );


                const promoName =
                    promo.name ||
                    promo.id ||
                    "Promo";


                const promoCode =
                    promo.id ||
                    "";


                const promoType =
                    String(
                        promo.type ||
                        ""
                    )
                        .trim()
                        .toUpperCase();


                const promoValue =
                    getPromoValueDisplay(
                        promo
                    );


                let promoMeta =
                    promoCode;


                if (
                    promoType
                ) {

                    promoMeta +=
                        (
                            promoMeta
                                ?
                                    " • "
                                :
                                    ""
                        )
                        +
                        promoType;

                }


                if (
                    promoValue
                ) {

                    promoMeta +=
                        (
                            promoMeta
                                ?
                                    " • "
                                :
                                    ""
                        )
                        +
                        promoValue;

                }


                promoHTML = `

                    <div class="promoSection">

                        <div class="promoSubtotalRow">

                            <span>
                                Subtotal
                            </span>

                            <span>
                                ${formatMoney(
                                    subtotal
                                )}
                            </span>

                        </div>


                        <div class="promoDetails">

                            <div class="promoName">

                                ${escapeHTML(
                                    promoName
                                )}

                            </div>

                            <div class="promoMeta">

                                ${escapeHTML(
                                    promoMeta
                                )}

                            </div>

                        </div>


                        <div class="promoDiscountRow">

                            <span>
                                Discount
                            </span>

                            <span class="promoDiscountAmount">

                                -${formatMoney(
                                    discountAmount
                                )}

                            </span>

                        </div>

                    </div>

                `;

            }


            const refunded =
                sale.refunded ===
                true;


            const voided =
                sale.voided ===
                true;


            const adjusted =
                refunded ||
                voided;


            let adjustmentHTML =
                "";


            let actionsHTML =
                "";


            if (
                adjusted
            ) {

                const originalTotal =
                    Number(
                        sale.original_total ??
                        0
                    );


                const adjustmentLabel =
                    refunded
                        ?
                            "REFUNDED"
                        :
                            "VOIDED";


                const timeLabel =
                    refunded
                        ?
                            "Refunded"
                        :
                            "Voided";


                adjustmentHTML = `

                    <div
                        class="saleAdjustmentStatus ${
                            refunded
                                ?
                                    "refunded"
                                :
                                    "voided"
                        }"
                    >

                        <div class="saleAdjustmentTitle">

                            <span>
                                ${adjustmentLabel}
                            </span>

                            <span>
                                0 VND
                            </span>

                        </div>


                        <div class="saleAdjustmentOriginal">

                            <span>
                                Original total
                            </span>

                            <span class="saleAdjustmentOriginalAmount">

                                ${formatMoney(
                                    originalTotal
                                )}

                            </span>

                        </div>


                        <div class="saleAdjustmentTime">

                            ${escapeHTML(
                                timeLabel +
                                " at " +
                                formatAdjustmentDateTime(
                                    sale.timeVR
                                )
                            )}

                        </div>

                    </div>

                `;

            }

            else {

                actionsHTML = `

                    <div class="saleActions">

                        <button
                            class="saleAdjustmentButton refundButton"
                            type="button"
                            data-transaction-id="${escapeHTML(
                                sale.transaction_id ||
                                ""
                            )}"
                            onclick="requestSaleAdjustment(this, 'refund')"
                        >
                            REFUND
                        </button>

                        <button
                            class="saleAdjustmentButton voidButton"
                            type="button"
                            data-transaction-id="${escapeHTML(
                                sale.transaction_id ||
                                ""
                            )}"
                            onclick="requestSaleAdjustment(this, 'void')"
                        >
                            VOID
                        </button>

                    </div>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "saleCard";


            card.innerHTML = `

                <div class="saleCardTop">

                    <div class="transactionId">

                        ${escapeHTML(
                            sale.transaction_id ||
                            "UNKNOWN"
                        )}

                    </div>


                    <div class="saleAmount">

                        ${formatMoney(
                            sale.total
                        )}

                    </div>

                </div>


                <div class="saleDateTime">

                    <div>

                        ${escapeHTML(
                            paid.date
                        )}

                    </div>


                    <div>

                        ${escapeHTML(
                            paid.time
                        )}

                    </div>

                </div>


                <div class="saleTable"><strong>User:</strong> ${escapeHTML(sale.cashier?.username || 'Not recorded')}</div>

                <div class="saleTable"><strong>Payment:</strong> ${escapeHTML(formatPaymentMethod(sale.payment_method))}</div>

                <div class="saleTable">

                    ${escapeHTML(
                        sale.table ||
                        ""
                    )}

                </div>


                <div class="drinkSection">

                    <div class="drinkLabel">
                        Drinks
                    </div>


                    <div class="drinkList">

                        ${drinkHTML}

                    </div>

                </div>


                ${promoHTML}


                ${adjustmentHTML}


                ${actionsHTML}
                <div class="saleActions">
                    <button class="saleAdjustmentButton reprintReceiptButton" type="button"
                        data-transaction-id="${escapeHTML(sale.transaction_id || '')}"
                        onclick="reprintSale(this)">REPRINT RECEIPT</button>
                </div>


            `;


            grid.appendChild(
                card
            );

        }
    );

}


// ============================================================
// UPDATE SUMMARY
// ============================================================

function updateSummary() {

    const count =
        filteredSales.length;


    let revenue =
        0;


    filteredSales.forEach(
        sale => {

            revenue +=
                Number(
                    sale.total ||
                    0
                );

        }
    );


    document.getElementById(
        "summaryCount"
    ).textContent =
        count +
        (
            count === 1
                ? " sale"
                : " sales"
        );


    document.getElementById(
        "summaryRevenue"
    ).textContent =
        formatMoney(
            revenue
        );

}


// ============================================================
// UPDATE PAGINATION
// ============================================================

function updatePagination() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredSales.length /
                SALES_PER_PAGE
            )
        );


    document.getElementById(
        "pageDisplay"
    ).textContent =
        "Page " +
        currentPage +
        " of " +
        totalPages;


    document.getElementById(
        "previousPageButton"
    ).disabled =
        (
            currentPage <= 1
        );


    document.getElementById(
        "nextPageButton"
    ).disabled =
        (
            currentPage >=
            totalPages
        );

}


// ============================================================
// PREVIOUS PAGE
// ============================================================

function previousPage() {

    if (
        currentPage <=
        1
    ) {

        return;

    }


    currentPage--;


    renderSales();

    updatePagination();


    window.scrollTo(
        {

            top:
                0,

            behavior:
                "smooth"

        }
    );

}


// ============================================================
// NEXT PAGE
// ============================================================

function nextPage() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredSales.length /
                SALES_PER_PAGE
            )
        );


    if (
        currentPage >=
        totalPages
    ) {

        return;

    }


    currentPage++;


    renderSales();

    updatePagination();


    window.scrollTo(
        {

            top:
                0,

            behavior:
                "smooth"

        }
    );

}


// ============================================================
// CLEAR FILTERS
// ============================================================

function clearFilters() {

    document.getElementById(
        "searchInput"
    ).value =
        "";


    document.getElementById(
        "dayFilter"
    ).value =
        "";


    document.getElementById(
        "monthFilter"
    ).value =
        "";


    document.getElementById(
        "yearFilter"
    ).value =
        "";


    currentPage =
        1;


    loadSales();

}


// ============================================================
// APP DIALOG EVENTS
// ============================================================

document
    .getElementById(
        "appDialogOverlay"
    )
    .addEventListener(
        "click",
        function(
            event
        ) {

            if (
                event.target ===
                this
            ) {

                closeAppDialog(
                    false
                );

            }

        }
    );


document.addEventListener(
    "keydown",
    function(
        event
    ) {

        const overlay =
            document.getElementById(
                "appDialogOverlay"
            );


        if (
            !overlay.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "Escape"
        ) {

            event.preventDefault();


            closeAppDialog(
                false
            );

        }

        else if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();


            closeAppDialog(
                true
            );

        }

    }
);


// ============================================================
// START SALES PAGE
// ============================================================

async function startSalesPage() {

    createDayOptions();

    createYearOptions();


    const online =
        await checkServer();


    if (
        !online
    ) {

        document.getElementById(
            "salesGrid"
        ).innerHTML = `

            <div class="messageBox error">
                Server offline.
            </div>

        `;


        return;

    }


    await loadSales();

}


// ============================================================
// START
// ============================================================

startSalesPage();


</script>

<script>

async function reprintSale(button) {
    button.disabled = true;
    try {
        const id = button.dataset.transactionId;
        const known = sales.find(sale => sale.transaction_id === id);
        const day = known?.business_date;
        const response = await fetch(SERVER_URL + '/api/sales/history' + (day ? '?date=' + encodeURIComponent(day) : ''));
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not load receipt.');
        const sale = (data.sales || []).find(value => value.transaction_id === id);
        if (!sale) throw new Error('Sale not found. Refresh the sales list.');
        document.getElementById('receiptContent').innerHTML = NAUReceipt.fromSale(sale);
        document.getElementById('receiptOverlay').classList.add('active');
    } catch (error) {
        await appAlert(error.message, {title: 'REPRINT FAILED', tone: 'error'});
    } finally { button.disabled = false; }
}
function printReceipt() { NAUReceipt.print(); }
function closeReceiptPreview() { document.getElementById('receiptOverlay').classList.remove('active'); }

</script>

<script id="nau-storage-notice-script">
(() => {
    'use strict';

    const STORAGE_API = 'http://127.0.0.1:8000';
    let lastNoticeId = null;
    let noticeInitialized = false;
    let polling = false;

    function ensureStorageDialog() {
        let overlay = document.getElementById('nau-storage-notice-overlay');
        if (overlay) return overlay;

        overlay = document.createElement('div');
        overlay.id = 'nau-storage-notice-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-labelledby', 'nau-storage-notice-title');
        overlay.innerHTML = `
            <div id="nau-storage-notice-card">
                <div id="nau-storage-notice-heading">
                    <span id="nau-storage-notice-dot" aria-hidden="true"></span>
                    <h2 id="nau-storage-notice-title">STORAGE WARNING</h2>
                </div>
                <p id="nau-storage-notice-message"></p>
                <button id="nau-storage-notice-ok" type="button">OK</button>
            </div>`;
        document.body.appendChild(overlay);

        document.getElementById('nau-storage-notice-ok')
            .addEventListener('click', () => overlay.classList.remove('open'));

        return overlay;
    }

    function updateServerStatus(storage) {
        const element =
            document.getElementById('serverStatus')
            || document.getElementById('serverStatusText');

        if (!element || !storage) return;

        if (String(storage.mode || '').toUpperCase() === 'BACKUP') {
            element.textContent = 'Server online • BACKUP';
        }
    }

    function showStorageNotice(storage) {
        if (!storage || typeof storage !== 'object') return;

        const notice = storage.notice;
        if (!notice || notice.id === undefined || notice.id === null) return;

        const noticeId = String(notice.id);

        // /notifications/pending only returns an undisplayed event.
        // Never suppress the first pending notification on page load.
        noticeInitialized = true;

        if (noticeId === lastNoticeId) return;
        lastNoticeId = noticeId;

        const backupActive =
            String(notice.type || '').toLowerCase() === 'database_failover';

        const mainRestored =
            String(notice.type || '').toLowerCase() === 'main_restored' ||
            String(notice.message || '').startsWith('MAIN DATABASE RESTORED');

        const overlay = ensureStorageDialog();
        document.getElementById('nau-storage-notice-title').textContent =
            mainRestored
                ? 'MAIN DATABASE RESTORED'
                : (
                    backupActive
                        ? 'DATABASE BACKUP ACTIVE'
                        : 'STORAGE WARNING'
                );

        const dot =
            document.getElementById('nau-storage-notice-dot');

        dot.classList.toggle(
            'restored',
            mainRestored
        );

        let message;

        if (mainRestored) {
            message =
                'The main database is available again.\n\n' +
                'Backup data has been synchronized and verified. ' +
                'The POS is now using the main database again.';
        } else if (backupActive) {
            message =
                'The main database is currently unavailable.\n\n' +
                'The POS has switched to the live backup database. ' +
                'You can continue working normally while the server waits for Main to return.';
        } else {
            message =
                String(
                    notice.message ||
                    'The server reported a storage warning.'
                );
        }

        document.getElementById('nau-storage-notice-message').textContent =
            message;

        overlay.classList.add('open');
    }

    async function pollStorageStatus() {
        if (polling) return;
        polling = true;

        try {
            const response = await window.fetch(
                STORAGE_API + '/api/server/notifications/pending',
                {
                    headers: {
                        'X-NAU-Backend-Diagnostic': '1'
                    }
                }
            );

            if (!response.ok) return;

            const payload = await response.json();
            const notice =
            payload &&
            payload.notification;

            if (!notice) return;

            // Show it first, THEN tell the server it was displayed.
            showStorageNotice({
                notice: notice
            });

            await window.fetch(
                STORAGE_API + '/api/server/notifications/ack',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-NAU-Backend-Diagnostic': '1'
                    },
                    body: JSON.stringify({
                        id: notice.id,
                        client: 'sales.html'
                    })
                }
            );
        } catch (_) {
            // No ACK on failure; pending notification remains available.
        } finally {
            polling = false;
        }
    }

    function startStorageWatcher() {
        ensureStorageDialog();
        /* Database storage notifications disabled. */
        window.setInterval(pollStorageStatus, 3000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startStorageWatcher, {once:true});
    } else {
        /* Database storage notifications are server-managed in V15. */
    }
})();
</script>
