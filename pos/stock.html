/* ====================================================
   NÁU DARK SCROLLBARS
   ==================================================== */

/*
  WebView2/Chromium otherwise uses the bright Windows scrollbar, which looks
  completely out of place against NÁU's dark panels.
*/
html {
    scrollbar-color: #4b4b4b #181818;
    scrollbar-width: thin;
}

* {
    scrollbar-color: #4b4b4b transparent;
    scrollbar-width: thin;
}

*::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    min-height: 34px;
    background: #4b4b4b;
    border: 2px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
}

*::-webkit-scrollbar-thumb:hover {
    background: #666;
    border: 2px solid transparent;
    background-clip: padding-box;
}

*::-webkit-scrollbar-thumb:active {
    background: #777;
    border: 2px solid transparent;
    background-clip: padding-box;
}

*::-webkit-scrollbar-corner {
    background: transparent;
}

*::-webkit-scrollbar-button {
    width: 0;
    height: 0;
    display: none;
}

</style>

<script>(() => {
    'use strict';
    const API = 'http://127.0.0.1:8000';
    const KEY = 'nau_profile_session_v1';
    const nativeFetch = window.fetch.bind(window);
    document.documentElement.classList.add('nau-locked');
    let token = '', expiryTimer, logoutDeadline = 0, currentUsername = '';
    let transferring = false, leavingForPOS = false;
    const navigationKind = performance.getEntriesByType('navigation')[0]?.type;
    const marker = new URLSearchParams(location.hash.slice(1)).get('nau-login');
    const incomingTicket = navigationKind === 'reload' || navigationKind === 'back_forward' ? null : marker;
    // Consume the navigation marker before any asynchronous work. A reload
    // cannot reuse it, and the session itself is never placed in the URL.
    if (marker) history.replaceState(null, '', location.href.split('#')[0]);
    let finishLogin;
    const ready = new Promise(resolve => { finishLogin = resolve; });
    // The bearer token lives ONLY in this page's memory. SERVER persists only
    // its SHA-256 hash, so restarting SERVER does not invalidate an already-open
    // POS page. Reloading/reopening the frontend still requires login.
    try {
        const previous = localStorage.getItem(KEY);
        localStorage.removeItem(KEY);
        if (previous) nativeFetch(API + '/api/auth/logout', {
            method: 'POST', headers: {'Authorization': 'Bearer ' + previous}
        }).catch(() => {});
    } catch (_) {}
    function relock() {
        const previous = token;
        token = '';
        document.documentElement.classList.add('nau-locked');
        if (previous) nativeFetch(API + '/api/auth/logout', {
            method: 'POST', headers: {'Authorization': 'Bearer ' + previous}, keepalive: true
        }).catch(() => {});
        location.reload();
    }
    window.fetch = async (input, init = {}) => {
        const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
        if (url.origin !== API) return nativeFetch(input, init);
        await ready;
        const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
        headers.set('Authorization', 'Bearer ' + token);
        const result = await nativeFetch(input, {...init, headers});
        if (result.status === 401) relock();
        return result;
    };
    async function digest(text) {
        if (!window.crypto || !crypto.subtle) throw new Error('Open this page in a current browser on the POS computer.');
        const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)));
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }
    async function authCall(route, body, authToken) {
        let response;
        try {
            response = await nativeFetch(API + '/api/auth/' + route, {
                method: body === undefined ? 'GET' : 'POST',
                headers: {'Content-Type': 'application/json', ...(authToken ? {'Authorization': 'Bearer ' + authToken} : {})},
                body: body === undefined ? undefined : JSON.stringify(body)
            });
        } catch (_) {
            const error = new Error('Cannot connect to the server. Waiting for SERVER to return…');
            error.nauNetworkError = true;
            throw error;
        }

        let result;

        try {
            result = await response.json();
        } catch (_) {
            const error = new Error('SERVER is restarting. Waiting for it to return…');
            error.nauNetworkError = true;
            throw error;
        }

        if (!response.ok || !result.success) {
            const error = new Error(result.error || 'Login request failed.');
            error.nauStatus = response.status;
            throw error;
        }

        return result;
    }

    const waitForServer = () =>
        new Promise(resolve => setTimeout(resolve, 1000));

    async function authCallThroughRestart(route, body, authToken) {
        while (true) {
            try {
                return await authCall(route, body, authToken);
            } catch (error) {
                if (!error.nauNetworkError) throw error;
                await waitForServer();
            }
        }
    }
    window.NAUProfile = {
        get username() { return currentUsername; },
        navigate: async target => {
            if (transferring || !token) return;

            const destination = new URL(target, location.href);
            const name = destination.pathname.split('/').pop();

            /*
              Clicking the tab for the page we are already on must be a no-op.

              Previously this created a transfer ticket and then navigated only
              to a new hash on the SAME document. Because the page did not
              actually reload, `transferring` stayed true forever and every
              later tab click was ignored.
            */
            const currentName =
                location.pathname.split('/').pop()
                || 'index.html';

            if (name === currentName) {
                return;
            }

            transferring = true;
            try {
                // If SERVER is between stop/start, keep this page unlocked and
                // wait for it to return. No login screen is shown.
                const transfer = await authCallThroughRestart('transfer', {
                    target: name, username: currentUsername
                }, token);
                destination.hash = 'nau-login=' + encodeURIComponent(transfer.ticket);
                leavingForPOS = true;
                location.assign(destination.href);
            } catch (error) {
                leavingForPOS = false;
                transferring = false;
                await appAlert(
                    error.message,
                    {
                        title: "Navigation Error",
                        tone: "error"
                    }
                );
            }
        }
    };
    document.addEventListener('DOMContentLoaded', async () => {
        const panel = document.createElement('section');
        panel.id = 'nau-auth-overlay';
        panel.hidden = Boolean(incomingTicket);
        panel.innerHTML = `
          <div class="nau-auth-card">
            <div class="nau-auth-brand">NÁU POS</div>
            <h1 id="nau-auth-title">Log in</h1>
            <p id="nau-auth-help">Enter your profile to open the POS.</p>
            <nav aria-label="Profile actions">
              <button type="button" data-mode="login">Log in</button>
              <button type="button" data-mode="register">Create profile</button>
            </nav>
            <form id="nau-auth-form">
              <label id="nau-login-profile-label">User profile<select id="nau-login-profile" required><option value="">Loading profiles…</option></select></label>
              <button id="nau-reload-profiles" type="button">Refresh profiles</button>
              <label id="nau-auth-user-label">Username<input id="nau-auth-user" autocomplete="username" required maxlength="100"></label>
              <label><span id="nau-password-label">Password</span><input id="nau-auth-password" type="password" autocomplete="current-password" required maxlength="512"></label>
              <button id="nau-forgot-password" type="button" data-mode="reset">Forgot password?</button>
              <label id="nau-confirm-label" hidden>Confirm password<input id="nau-auth-confirm" type="password" autocomplete="new-password" maxlength="512"></label>
              <label id="nau-pin-label" hidden>6-digit master PIN<input id="nau-auth-pin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6"></label>
              <p id="nau-auth-message" role="status" aria-live="polite"></p>
              <button id="nau-auth-submit" type="submit">Log in</button>
            </form>
            <button id="nau-change-pin" type="button">Change master PIN</button>
            <button id="nau-delete-user" type="button">Delete user profile</button>
            <form id="nau-delete-form" hidden>
              <label>Master 6-digit PIN<input id="nau-delete-pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label>
              <button id="nau-load-profiles" type="button">Load profiles</button>
              <label>Employee profile<select id="nau-delete-profile" required disabled><option value="">Enter master PIN and load profiles</option></select></label>
              
              <p>This removes the profile and its access. Past sales and receipts are kept.</p>
              <label><input id="nau-delete-confirm" type="checkbox" required style="display:inline;width:auto;height:auto"> I confirm I want to delete this user profile.</label>
              <p id="nau-delete-message" role="status" aria-live="polite"></p>
              <button id="nau-delete-submit" type="submit">Delete profile permanently</button>
              <button id="nau-delete-back" type="button">Back to login</button>
            </form>
            <form id="nau-pin-form" hidden>
              <label>Current 6-digit PIN<input id="nau-old-pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label>
              <label>New 6-digit PIN<input id="nau-new-pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label>
              <label>Confirm new PIN<input id="nau-new-pin-confirm" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label>
              <p id="nau-pin-message" role="status" aria-live="polite"></p>
              <button id="nau-pin-save" type="submit">Save new PIN</button>
              <button id="nau-pin-back" type="button">Back to login</button>
            </form>
          </div>`;
        document.body.appendChild(panel);
        const byId = id => document.getElementById(id);
        let mode = 'login', busy = false;
        let loginProfiles = [];
        function updateLoginField() {
            const profile = loginProfiles.find(p => p.account_id === byId('nau-login-profile').value);
            const needsUsername = mode !== 'login' || Boolean(profile && !profile.username);
            byId('nau-auth-user-label').hidden = !needsUsername;
            byId('nau-auth-user').required = needsUsername;
        }
        async function loadLoginProfiles() {
            const select = byId('nau-login-profile');
            select.disabled = true;
            try {
                const result = await authCall('login-profiles');
                loginProfiles = result.profiles;
                select.replaceChildren(new Option('Choose your profile', ''));
                for (const profile of loginProfiles) select.add(new Option(profile.label, profile.account_id));
                let preferred = result.last_account_id;
                try { preferred = localStorage.getItem('nau_last_login_profile') || preferred; } catch (_) {}
                select.value = loginProfiles.some(p => p.account_id === preferred) ? preferred : '';
                byId('nau-auth-message').textContent = loginProfiles.length ? '' : 'No profiles yet. Select Create profile.';
            } catch (error) {
                select.replaceChildren(new Option('Could not load profiles', ''));
                byId('nau-auth-message').textContent = error.message;
            } finally { select.disabled = false; updateLoginField(); }
        }
        byId('nau-login-profile').addEventListener('change', () => {
            byId('nau-auth-password').value = '';
            byId('nau-auth-user').value = '';
            updateLoginField();
        });
        byId('nau-reload-profiles').addEventListener('click', () => { if (!busy) loadLoginProfiles(); });
        function setMode(next) {
            mode = next;
            byId('nau-login-profile-label').hidden = mode !== 'login';
            byId('nau-reload-profiles').hidden = mode !== 'login';
            byId('nau-login-profile').required = mode === 'login';
            updateLoginField();
            if (mode === 'login' && !incomingTicket) loadLoginProfiles();
            byId('nau-auth-form').hidden = false;
            byId('nau-pin-form').hidden = true;
            byId('nau-change-pin').hidden = false;
            byId('nau-delete-user').hidden = false;
            byId('nau-delete-form').hidden = true;
            byId('nau-delete-form').reset();
            byId('nau-delete-profile').replaceChildren(new Option('Enter master PIN and load profiles', ''));
            byId('nau-delete-profile').disabled = true;
            byId('nau-pin-form').reset();
            const privileged = mode !== 'login';
            byId('nau-auth-title').textContent = mode === 'login' ? 'Log in' : mode === 'register' ? 'Create profile' : 'Reset password';
            byId('nau-auth-submit').textContent = byId('nau-auth-title').textContent;
            byId('nau-auth-help').textContent = privileged ? 'Use the master PIN set on the server. Passwords need at least 8 characters.' : 'Enter your profile to open the POS.';
            byId('nau-password-label').textContent = mode === 'reset' ? 'New password' : 'Password';
            byId('nau-auth-password').autocomplete = privileged ? 'new-password' : 'current-password';
            byId('nau-auth-password').minLength = privileged ? 8 : 1;
            byId('nau-forgot-password').hidden = privileged;
            byId('nau-confirm-label').hidden = !privileged;
            byId('nau-pin-label').hidden = !privileged;
            byId('nau-auth-confirm').required = privileged;
            byId('nau-auth-pin').required = privileged;
            ['nau-auth-password', 'nau-auth-confirm', 'nau-auth-pin'].forEach(id => { byId(id).value = ''; });
            byId('nau-auth-message').textContent = '';
            panel.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
        }
        panel.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { if (!busy) setMode(button.dataset.mode); }));
        byId('nau-change-pin').addEventListener('click', () => {
            if (busy) return;
            byId('nau-auth-form').reset();
            byId('nau-auth-form').hidden = true;
            byId('nau-pin-form').hidden = false;
            byId('nau-change-pin').hidden = true;
            byId('nau-delete-user').hidden = true;
            byId('nau-auth-title').textContent = 'Change master PIN';
            byId('nau-auth-help').textContent = 'Enter your current PIN and confirm a new 6-digit PIN.';
            byId('nau-pin-message').textContent = '';
            byId('nau-old-pin').focus();
        });
        byId('nau-pin-back').addEventListener('click', () => { if (!busy) setMode('login'); });
        byId('nau-delete-user').addEventListener('click', () => {
            if (busy) return;
            byId('nau-auth-form').reset();
            byId('nau-auth-form').hidden = true;
            byId('nau-pin-form').hidden = true;
            byId('nau-change-pin').hidden = true;
            byId('nau-delete-user').hidden = true;
            byId('nau-delete-form').hidden = false;
            byId('nau-auth-title').textContent = 'Delete user profile';
            byId('nau-auth-help').textContent = 'Enter your master PIN, load profiles, then choose the employee to delete.';
            byId('nau-delete-message').textContent = '';
            byId('nau-delete-pin').focus();
        });
        byId('nau-load-profiles').addEventListener('click', async () => {
            if (busy) return;
            busy = true;
            byId('nau-load-profiles').disabled = true;
            const select = byId('nau-delete-profile');
            select.replaceChildren(new Option('Choose a profile', ''));
            select.disabled = true;
            byId('nau-delete-confirm').checked = false;
            try {
                const pin = byId('nau-delete-pin').value;
                if (!/^[0-9]{6}$/.test(pin)) throw new Error('Enter your 6-digit master PIN first.');
                const hash = await digest(pin);
                const result = await authCall('profiles', {pin_hash: hash.slice(6) + hash.slice(0, 6)});
                for (const profile of result.profiles) select.add(new Option(profile.label, profile.account_id));
                select.disabled = result.profiles.length === 0;
                byId('nau-delete-message').textContent = result.profiles.length ? 'Select the profile to delete.' : 'No profiles exist.';
            } catch (error) { byId('nau-delete-message').textContent = error.message; }
            finally { busy = false; byId('nau-load-profiles').disabled = false; }
        });
        byId('nau-delete-profile').addEventListener('change', () => { byId('nau-delete-confirm').checked = false; });
        byId('nau-delete-back').addEventListener('click', () => { if (!busy) setMode('login'); });
        byId('nau-delete-form').addEventListener('submit', async event => {
            event.preventDefault();
            if (busy) return;
            busy = true;
            byId('nau-delete-submit').disabled = true;
            byId('nau-delete-message').textContent = 'Deleting…';
            try {
                const accountId = byId('nau-delete-profile').value;
                const pin = byId('nau-delete-pin').value;
                if (!accountId || !/^[0-9]{6}$/.test(pin) || !byId('nau-delete-confirm').checked) throw new Error('Select a profile, enter the master PIN, and confirm deletion.');
                const hash = await digest(pin);
                const result = await authCall('delete-user', {
                    account_id: accountId, pin_hash: hash.slice(6) + hash.slice(0, 6), confirm_delete: true
                });
                setMode('login');
                byId('nau-auth-message').textContent = result.message;
            } catch (error) { byId('nau-delete-message').textContent = error.message; }
            finally { busy = false; byId('nau-delete-submit').disabled = false; }
        });
        byId('nau-pin-form').addEventListener('submit', async event => {
            event.preventDefault();
            if (busy) return;
            busy = true;
            byId('nau-pin-save').disabled = true;
            byId('nau-pin-message').textContent = 'Saving…';
            try {
                const values = ['nau-old-pin', 'nau-new-pin', 'nau-new-pin-confirm'].map(id => byId(id).value);
                if (!values.every(v => /^[0-9]{6}$/.test(v))) throw new Error('Every PIN must contain exactly 6 digits.');
                if (values[1] !== values[2]) throw new Error('New PINs do not match.');
                const hashes = await Promise.all(values.map(async value => {
                    const hash = await digest(value);
                    return hash.slice(6) + hash.slice(0, 6);
                }));
                const result = await authCall('change-pin', {
                    old_pin_hash: hashes[0], new_pin_hash: hashes[1], confirm_pin_hash: hashes[2]
                });
                setMode('login');
                byId('nau-auth-message').textContent = result.message;
            } catch (error) { byId('nau-pin-message').textContent = error.message; }
            finally { busy = false; byId('nau-pin-save').disabled = false; }
        });
        function unlock(session, sessionToken, username) {
            token = sessionToken;
            currentUsername = username;
            panel.remove();
            document.documentElement.classList.remove('nau-locked');
            const badge = document.createElement('button');
            badge.id = 'nau-profile-logout';
            badge.textContent = username + ' · Log out';
            badge.addEventListener('click', async () => {
                badge.disabled = true;
                document.documentElement.classList.add('nau-locked');
                try { await authCall('logout', {}, token); } finally { relock(); }
            });
            document.body.appendChild(badge);
            clearTimeout(expiryTimer);
            const remaining = Math.max(0, session.expires_in * 1000);
            logoutDeadline = Date.now() + remaining;
            expiryTimer = setTimeout(relock, remaining);
            finishLogin();
        }
        byId('nau-auth-form').addEventListener('submit', async event => {
            event.preventDefault();
            if (busy) return;
            busy = true;
            byId('nau-auth-submit').disabled = true;
            byId('nau-auth-message').textContent = 'Please wait…';
            try {
                const selectedProfile = loginProfiles.find(p => p.account_id === byId('nau-login-profile').value);
                if (mode === 'login' && !selectedProfile) throw new Error('Choose a user profile.');
                const username = (mode === 'login' && selectedProfile.username ? selectedProfile.username : byId('nau-auth-user').value).trim().normalize('NFC');
                const password = byId('nau-auth-password').value;
                if (!username) throw new Error('Enter a username.');
                if (mode !== 'login' && password !== byId('nau-auth-confirm').value) throw new Error('Passwords do not match.');
                const payload = {username, username_hash: await digest(username), credentials_hash: await digest(JSON.stringify([username, password]))};
                if (mode === 'login') payload.account_id = selectedProfile.account_id;
                if (mode !== 'login') {
                    const pin = byId('nau-auth-pin').value;
                    if (!/^[0-9]{6}$/.test(pin)) throw new Error('Enter exactly 6 digits for the master PIN.');
                    const hashed = await digest(pin);
                    payload.pin_hash = hashed.slice(6) + hashed.slice(0, 6);
                }
                const result = await authCall(mode, payload);
                if (mode === 'login') {
                    try { localStorage.setItem('nau_last_login_profile', result.account_id); } catch (_) {}
                    unlock(result, result.token, result.username); return;
                }
                setMode('login');
                byId('nau-auth-message').textContent = result.message;
                byId('nau-auth-password').focus();
            } catch (error) {
                byId('nau-auth-message').textContent = error.message;
            } finally {
                busy = false;
                const submit = byId('nau-auth-submit');
                if (submit) submit.disabled = false;
            }
        });
        setMode('login');
        if (incomingTicket) {
            busy = true;
            byId('nau-auth-submit').disabled = true;
            byId('nau-auth-message').textContent = 'Opening POS page…';
            try {
                // A SERVER restart during page navigation must not turn into a
                // login prompt. The one-time ticket is hash-persisted server-side
                // and this page retries once per second until SERVER is back.
                const session = await authCallThroughRestart('resume', {
                    ticket: incomingTicket, target: location.pathname.split('/').pop()
                });
                unlock(session, session.token, session.username);
            } catch (_) {
                panel.hidden = false;
                loadLoginProfiles();
                byId('nau-auth-message').textContent = 'Please log in to continue.';
            } finally {
                busy = false;
                const button = byId('nau-auth-submit');
                if (button) button.disabled = false;
            }
        }
    });
    window.addEventListener('pagehide', () => {
        if (token && !leavingForPOS) nativeFetch(API + '/api/auth/logout', {
            method: 'POST', headers: {'Authorization': 'Bearer ' + token}, keepalive: true
        }).catch(() => {});
    });
    window.addEventListener('pageshow', event => { if (event.persisted) relock(); });
    const checkDeadline = () => { if (token && Date.now() >= logoutDeadline) relock(); };
    window.addEventListener('focus', checkDeadline);
    document.addEventListener('visibilitychange', checkDeadline);
})();
</script>

<main>

        >

        </button>

        </div>

<script>


const SERVER_URL =
    "http://127.0.0.1:8000";


let ingredients =
    [];


let filteredIngredients =
    [];


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ============================================================
// FORMAT STOCK
// ============================================================

function formatStock(
    value
) {

    const number =
        Number(
            value || 0
        );


    if (
        Number.isInteger(
            number
        )
    ) {

        return number.toLocaleString(
            "vi-VN"
        );

    }


    return number.toLocaleString(
        "vi-VN",
        {

            minimumFractionDigits:
                0,

            maximumFractionDigits:
                2

        }
    );

}


// ============================================================
// CHECK REORDER LEVEL
// ============================================================

function needsReorder(
    ingredient
) {

    const stock =
        Number(
            ingredient.stock ||
            0
        );


    const reorderValue =
        ingredient.reorder_level ??
        ingredient.reorder_at ??
        0;


    const reorderLevel =
        Number(
            reorderValue
        );


    if (
        !Number.isFinite(
            stock
        ) ||
        !Number.isFinite(
            reorderLevel
        )
    ) {

        return false;

    }


    return (
        stock <=
        reorderLevel
    );

}


// ============================================================
// CHECK SERVER
// ============================================================

async function checkServer() {

    try {

        const response =
            await fetch(
                SERVER_URL + "/"
            );


        if (!response.ok) {

            throw new Error(
                "Server unavailable"
            );

        }


        const data =
            await response.json();


        if (
            data.status !==
            "online"
        ) {

            throw new Error(
                "Invalid server response"
            );

        }


        document.getElementById(
            "serverStatus"
        ).textContent =
            "Server online";


        document.getElementById(
            "serverStatus"
        ).style.color =
            "#7cff7c";


        return true;

    }

    catch (error) {

        document.getElementById(
            "serverStatus"
        ).textContent =
            "Server offline";


        document.getElementById(
            "serverStatus"
        ).style.color =
            "#ff6666";


        console.error(
            error
        );


        return false;

    }

}


// ============================================================
// LOAD INGREDIENTS
// ============================================================

async function loadIngredients() {

    const grid =
        document.getElementById(
            "stockGrid"
        );


    grid.innerHTML = `

        <div class="messageBox">
            Loading stock...
        </div>

    `;


    try {

        const response =
            await fetch(
                SERVER_URL +
                "/api/ingredients"
            );


        let data;


        try {

            data =
                await response.json();

        }

        catch {

            data = {};

        }


        if (
            !response.ok ||
            data.success !== true
        ) {

            throw new Error(
                data.error ||
                "Could not load ingredient stock."
            );

        }


        ingredients =
            Array.isArray(
                data.ingredients
            )
                ? data.ingredients
                : [];


        buildCategoryFilter();


        applyFilters();

    }

    catch (error) {

        console.error(
            "Could not load stock:",
            error
        );


        ingredients =
            [];


        filteredIngredients =
            [];


        grid.innerHTML = `

            <div class="messageBox error">
                ${escapeHTML(
                    error.message
                )}
            </div>

        `;


        updateSummary();

    }

}


// ============================================================
// BUILD CATEGORY FILTER
// ============================================================

function buildCategoryFilter() {

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );


    const previousValue =
        categoryFilter.value;


    categoryFilter.innerHTML = "";


    // ========================================================
    // ALL CATEGORIES
    // ========================================================

    const allOption =
        document.createElement(
            "option"
        );


    allOption.value =
        "";


    allOption.textContent =
        "All Categories";


    categoryFilter.appendChild(
        allOption
    );


    // ========================================================
    // RESTOCK
    //
    // Special filter kept above all real categories.
    // ========================================================

    const restockOption =
        document.createElement(
            "option"
        );


    restockOption.value =
        "RESTOCK";


    restockOption.textContent =
        "RESTOCK";


    restockOption.className =
        "restockOption";


    restockOption.style.color =
        "#ff4d4d";


    restockOption.style.fontWeight =
        "bold";


    categoryFilter.appendChild(
        restockOption
    );


    // ========================================================
    // DATABASE CATEGORIES
    // ========================================================

    const categories =
        [
            ...new Set(

                ingredients
                    .map(
                        ingredient =>
                            String(
                                ingredient.category ||
                                ""
                            )
                                .trim()
                                .toUpperCase()
                    )
                    .filter(
                        category =>
                            category !== ""
                    )

            )
        ];


    categories.sort(
        (
            first,
            second
        ) =>
            first.localeCompare(
                second
            )
    );


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category;


            option.textContent =
                category;


            categoryFilter.appendChild(
                option
            );

        }
    );


    if (
        previousValue ===
        "RESTOCK"
    ) {

        categoryFilter.value =
            "RESTOCK";

    }

    else if (
        categories.includes(
            previousValue
        )
    ) {

        categoryFilter.value =
            previousValue;

    }


    updateCategoryFilterAppearance();

}


// ============================================================
// CATEGORY FILTER CHANGED
// ============================================================

function categoryFilterChanged() {

    updateCategoryFilterAppearance();

    applyFilters();

}


// ============================================================
// UPDATE CATEGORY FILTER APPEARANCE
// ============================================================

function updateCategoryFilterAppearance() {

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );


    if (
        categoryFilter.value ===
        "RESTOCK"
    ) {

        categoryFilter.classList.add(
            "restockSelected"
        );

    }

    else {

        categoryFilter.classList.remove(
            "restockSelected"
        );

    }

}


// ============================================================
// APPLY FILTERS
// ============================================================

function applyFilters() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const category =
        document
            .getElementById(
                "categoryFilter"
            )
            .value
            .trim()
            .toUpperCase();


    filteredIngredients =
        ingredients.filter(
            ingredient => {

                const ingredientName =
                    String(
                        ingredient.name ||
                        ""
                    )
                        .trim()
                        .toLowerCase();


                const ingredientCategory =
                    String(
                        ingredient.category ||
                        ""
                    )
                        .trim()
                        .toUpperCase();


                const nameMatches =
                    (
                        !search ||
                        ingredientName.includes(
                            search
                        )
                    );


                let categoryMatches =
                    true;


                if (
                    category ===
                    "RESTOCK"
                ) {

                    categoryMatches =
                        needsReorder(
                            ingredient
                        );

                }

                else if (
                    category
                ) {

                    categoryMatches =
                        (
                            ingredientCategory ===
                            category
                        );

                }


                return (
                    nameMatches &&
                    categoryMatches
                );

            }
        );


    // ========================================================
    // SORT ORDER
    //
    // RESTOCK ingredients first.
    // Alphabetical inside RESTOCK.
    //
    // Remaining ingredients follow alphabetically.
    // ========================================================

    filteredIngredients.sort(
        (
            first,
            second
        ) => {

            const firstNeedsReorder =
                needsReorder(
                    first
                );


            const secondNeedsReorder =
                needsReorder(
                    second
                );


            if (
                firstNeedsReorder !==
                secondNeedsReorder
            ) {

                return firstNeedsReorder
                    ? -1
                    : 1;

            }


            const firstName =
                String(
                    first.name ||
                    ""
                );


            const secondName =
                String(
                    second.name ||
                    ""
                );


            return firstName.localeCompare(
                secondName,
                undefined,
                {

                    sensitivity:
                        "base"

                }
            );

        }
    );


    renderStock();

    updateSummary();

}


// ============================================================
// RENDER STOCK
// ============================================================

function renderStock() {

    const grid =
        document.getElementById(
            "stockGrid"
        );


    grid.innerHTML =
        "";


    if (
        filteredIngredients.length ===
        0
    ) {

        const category =
            document.getElementById(
                "categoryFilter"
            ).value;


        if (
            category ===
            "RESTOCK"
        ) {

            grid.innerHTML = `

                <div class="messageBox">
                    Nothing currently needs restocking.
                </div>

            `;

        }

        else {

            grid.innerHTML = `

                <div class="messageBox">
                    No ingredients found.
                </div>

            `;

        }


        return;

    }


    filteredIngredients.forEach(
        ingredient => {

            const reorder =
                needsReorder(
                    ingredient
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "stockCard";


            card.innerHTML = `

                <div>


                    <div class="ingredientName">

                        ${escapeHTML(
                            ingredient.name ||
                            "Unnamed Ingredient"
                        )}

                    </div>


                    <div class="ingredientCategory">

                        ${escapeHTML(
                            ingredient.category ||
                            ""
                        )}

                    </div>


                </div>


                <div class="stockArea">


                    <span
                        class="
                            stockNumber
                            ${reorder
                                ? "reorder"
                                : ""
                            }
                        "
                    >

                        ${escapeHTML(
                            formatStock(
                                ingredient.stock
                            )
                        )}

                    </span>


                    <span class="stockUnit">

                        ${escapeHTML(
                            ingredient.unit ||
                            ""
                        )}

                    </span>


                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


// ============================================================
// UPDATE SUMMARY
// ============================================================

function updateSummary() {

    const count =
        filteredIngredients.length;


    let reorderCount =
        0;


    filteredIngredients.forEach(
        ingredient => {

            if (
                needsReorder(
                    ingredient
                )
            ) {

                reorderCount++;

            }

        }
    );


    document.getElementById(
        "summaryCount"
    ).textContent =
        count +
        (
            count === 1
                ? " ingredient"
                : " ingredients"
        );


    const reorderElement =
        document.getElementById(
            "summaryReorder"
        );


    reorderElement.textContent =
        reorderCount +
        (
            reorderCount === 1
                ? " needs reorder"
                : " need reorder"
        );


    if (
        reorderCount > 0
    ) {

        reorderElement.classList.add(
            "warning"
        );

    }

    else {

        reorderElement.classList.remove(
            "warning"
        );

    }

}


// ============================================================
// CLEAR FILTERS
// ============================================================

function clearFilters() {

    document.getElementById(
        "searchInput"
    ).value =
        "";


    document.getElementById(
        "categoryFilter"
    ).value =
        "";


    updateCategoryFilterAppearance();

    applyFilters();

}


// ============================================================
// START STOCK PAGE
// ============================================================

async function startStockPage() {

    const online =
        await checkServer();


    if (
        !online
    ) {

        document.getElementById(
            "stockGrid"
        ).innerHTML = `

            <div class="messageBox error">
                Server offline.
            </div>

        `;


        return;

    }


    await loadIngredients();

}


// ============================================================
// START
// ============================================================

startStockPage();


</script>



<script id="nau-storage-notice-script">
(() => {
    'use strict';

    const STORAGE_API = 'http://127.0.0.1:8000';
    let lastNoticeId = null;
    let noticeInitialized = false;
    let polling = false;

    function ensureStorageDialog() {
        let overlay = document.getElementById('nau-storage-notice-overlay');
        if (overlay) return overlay;

        overlay = document.createElement('div');
        overlay.id = 'nau-storage-notice-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-labelledby', 'nau-storage-notice-title');
        overlay.innerHTML = `
            <div id="nau-storage-notice-card">
                <div id="nau-storage-notice-heading">
                    <span id="nau-storage-notice-dot" aria-hidden="true"></span>
                    <h2 id="nau-storage-notice-title">STORAGE WARNING</h2>
                </div>
                <p id="nau-storage-notice-message"></p>
                <button id="nau-storage-notice-ok" type="button">OK</button>
            </div>`;
        document.body.appendChild(overlay);

        document.getElementById('nau-storage-notice-ok')
            .addEventListener('click', () => overlay.classList.remove('open'));

        return overlay;
    }

    function updateServerStatus(storage) {
        const element =
            document.getElementById('serverStatus')
            || document.getElementById('serverStatusText');

        if (!element || !storage) return;

        if (String(storage.mode || '').toUpperCase() === 'BACKUP') {
            element.textContent = 'Server online • BACKUP';
        }
    }

    function showStorageNotice(storage) {
        if (!storage || typeof storage !== 'object') return;

        const notice = storage.notice;
        if (!notice || notice.id === undefined || notice.id === null) return;

        const noticeId = String(notice.id);

        // /notifications/pending only returns an undisplayed event.
        // Never suppress the first pending notification on page load.
        noticeInitialized = true;

        if (noticeId === lastNoticeId) return;
        lastNoticeId = noticeId;

        const backupActive =
            String(notice.type || '').toLowerCase() === 'database_failover';

        const mainRestored =
            String(notice.type || '').toLowerCase() === 'main_restored' ||
            String(notice.message || '').startsWith('MAIN DATABASE RESTORED');

        const overlay = ensureStorageDialog();
        document.getElementById('nau-storage-notice-title').textContent =
            mainRestored
                ? 'MAIN DATABASE RESTORED'
                : (
                    backupActive
                        ? 'DATABASE BACKUP ACTIVE'
                        : 'STORAGE WARNING'
                );

        const dot =
            document.getElementById('nau-storage-notice-dot');

        dot.classList.toggle(
            'restored',
            mainRestored
        );

        let message;

        if (mainRestored) {
            message =
                'The main database is available again.\n\n' +
                'Backup data has been synchronized and verified. ' +
                'The POS is now using the main database again.';
        } else if (backupActive) {
            message =
                'The main database is currently unavailable.\n\n' +
                'The POS has switched to the live backup database. ' +
                'You can continue working normally while the server waits for Main to return.';
        } else {
            message =
                String(
                    notice.message ||
                    'The server reported a storage warning.'
                );
        }

        document.getElementById('nau-storage-notice-message').textContent =
            message;

        overlay.classList.add('open');
    }

    async function pollStorageStatus() {
        if (polling) return;
        polling = true;

        try {
            const response = await window.fetch(
                STORAGE_API + '/api/server/notifications/pending',
                {
                    headers: {
                        'X-NAU-Backend-Diagnostic': '1'
                    }
                }
            );

            if (!response.ok) return;

            const payload = await response.json();
            const notice =
            payload &&
            payload.notification;

            if (!notice) return;

            // Show it first, THEN tell the server it was displayed.
            showStorageNotice({
                notice: notice
            });

            await window.fetch(
                STORAGE_API + '/api/server/notifications/ack',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-NAU-Backend-Diagnostic': '1'
                    },
                    body: JSON.stringify({
                        id: notice.id,
                        client: 'stock.html'
                    })
                }
            );
        } catch (_) {
            // No ACK on failure; pending notification remains available.
        } finally {
            polling = false;
        }
    }

    function startStorageWatcher() {
        ensureStorageDialog();
        /* Database storage notifications disabled. */
        window.setInterval(pollStorageStatus, 3000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startStorageWatcher, {once:true});
    } else {
        /* Database storage notifications are server-managed in V15. */
    }
})();
</script>


    <!-- NAU APP DIALOG -->
    <div id="appDialogOverlay">
        <div
            id="appDialogModal"
            class="info"
            role="dialog"
            aria-modal="true"
            aria-labelledby="appDialogTitle"
            aria-describedby="appDialogMessage"
        >
            <div class="appDialogHeader">
                <div id="appDialogIndicator"></div>
                <div id="appDialogTitle">NAU POS</div>
            </div>

            <div id="appDialogMessage"></div>

            <div class="appDialogButtons">
                <button
                    id="appDialogCancelButton"
                    class="appDialogButton"
                    type="button"
                    onclick="closeAppDialog(false)"
                >
                    CANCEL
                </button>

                <button
                    id="appDialogConfirmButton"
                    class="appDialogButton"
                    type="button"
                    onclick="closeAppDialog(true)"
                >
                    OK
                </button>
            </div>
        </div>
    </div>


    <script>
        let appDialogResolver = null;

        function showAppDialog(options = {}) {
            return new Promise(resolve => {
                const overlay = document.getElementById("appDialogOverlay");
                const modal = document.getElementById("appDialogModal");
                const title = document.getElementById("appDialogTitle");
                const message = document.getElementById("appDialogMessage");
                const cancelButton = document.getElementById("appDialogCancelButton");
                const confirmButton = document.getElementById("appDialogConfirmButton");

                const tone = ["info", "success", "warning", "error"].includes(options.tone)
                    ? options.tone
                    : "info";

                modal.classList.remove("info", "success", "warning", "error");
                modal.classList.add(tone);

                title.textContent = options.title || "NAU POS";
                message.textContent = options.message || "";
                confirmButton.textContent = options.confirmText || "OK";

                if (options.cancelText) {
                    cancelButton.textContent = options.cancelText;
                    cancelButton.style.display = "block";
                } else {
                    cancelButton.style.display = "none";
                }

                if (appDialogResolver) {
                    const previous = appDialogResolver;
                    appDialogResolver = null;
                    previous(false);
                }

                appDialogResolver = resolve;
                overlay.classList.add("active");
                window.setTimeout(() => confirmButton.focus(), 0);
            });
        }

        function closeAppDialog(result) {
            const overlay = document.getElementById("appDialogOverlay");
            if (overlay) overlay.classList.remove("active");

            if (!appDialogResolver) return;

            const resolver = appDialogResolver;
            appDialogResolver = null;
            resolver(Boolean(result));
        }

        function appAlert(message, options = {}) {
            return showAppDialog({
                title: options.title || "NAU POS",
                message,
                tone: options.tone || "info",
                confirmText: options.confirmText || "OK",
                cancelText: null
            });
        }

        function appConfirm(message, options = {}) {
            return showAppDialog({
                title: options.title || "Confirm",
                message,
                tone: options.tone || "warning",
                confirmText: options.confirmText || "CONFIRM",
                cancelText: options.cancelText || "CANCEL"
            });
        }

        document.addEventListener("keydown", event => {
            const overlay = document.getElementById("appDialogOverlay");
            if (!overlay || !overlay.classList.contains("active")) return;

            if (event.key === "Escape") {
                event.preventDefault();
                const cancelButton = document.getElementById("appDialogCancelButton");
                closeAppDialog(
                    cancelButton && cancelButton.style.display !== "none"
                        ? false
                        : true
                );
            } else if (event.key === "Enter") {
                event.preventDefault();
                closeAppDialog(true);
            }
        });
    </script>
