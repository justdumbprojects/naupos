name: Source checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax when backend is present
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for file in Path('server').rglob('*.py') if Path('server').exists() else []:
              ast.parse(file.read_text(encoding='utf-8'), filename=str(file))
              print('OK:', file)
          PY
      - name: Reject accidentally tracked Google OAuth credential
        run: |
          test ! -f server/google_finance_client.json
          test ! -f google_finance_client.json
